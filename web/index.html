<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="แอปอ่านหนังสือสวดมนต์ ไทย-บาลี ใช้งานได้โดยไม่ต้องต่ออินเทอร์เน็ต">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="สวดมนต์">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>สวดมนต์</title>
  <link rel="manifest" href="manifest.json">

  <!-- Splash shown while Flutter boots. The lotus is the app's own loader
       asset (LoadingIndicator.asset in
       lib/shared/widgets/loading_indicator.dart), which a build serves under
       assets/; rename it in both places. -->
  <style>
    #splash {
      position: fixed;
      inset: 0;
      z-index: 99;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #FDF7EA;
      font-family: 'Sarabun', 'Leelawadee UI', 'Tahoma', sans-serif;
      transition: opacity 0.4s ease-out;
    }
    #splash.splash-hidden {
      opacity: 0;
      pointer-events: none;
    }
    #splash img {
      /* The size the in-app loader draws it at. The file has real alpha, so
         it needs no mask on either ground. */
      width: min(76vw, 288px);
      aspect-ratio: 1;
    }
    #splash .splash-title {
      /* Pulled up into the image's transparent margin, a sixth of its side. */
      margin-top: calc(min(76vw, 288px) / -6 + 12px);
      font-size: 44px;
      font-weight: 400;
      line-height: 1.3;
      color: #7A5524;
    }
    #splash .splash-sub {
      margin-top: 6px;
      font-size: 16px;
      color: #8A6F47;
    }
    #splash .splash-dots {
      display: flex;
      gap: 12px;
      margin-top: 22px;
    }
    #splash .splash-dots span {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: #E0B04A;
      animation: splash-dot 1.2s ease-in-out infinite;
    }
    #splash .splash-dots span:nth-child(2) { animation-delay: 0.2s; }
    #splash .splash-dots span:nth-child(3) { animation-delay: 0.4s; }
    @keyframes splash-dot {
      0%, 100% { opacity: 0.35; }
      40% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      #splash .splash-dots span { animation: none; }
    }
    @media (prefers-color-scheme: dark) {
      #splash { background: #241C14; }
      #splash .splash-title { color: #E8DCC3; }
      #splash .splash-sub { color: #B9A98A; }
      #splash .splash-dots span { background: #D9B84A; }
    }
  </style>
</head>
<body>
  <div id="splash">
    <img src="assets/assets/images/shared/splash_lotus.png" alt="">
    <div class="splash-title">สวดมนต์</div>
    <div class="splash-sub">กำลังเตรียมบทสวด…</div>
    <div class="splash-dots"><span></span><span></span><span></span></div>
  </div>

  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script>
    // Fade out the splash after Flutter draws its first frame.
    (function () {
      function hideSplash() {
        var splash = document.getElementById('splash');
        if (splash) {
          splash.classList.add('splash-hidden');
          setTimeout(function () { splash.remove(); }, 450);
        }
      }
      window.addEventListener('flutter-first-frame', hideSplash);
      // Fallback in case the event fired before the listener was ready.
      // Poll until Flutter has created its host view.
      var poll = setInterval(function () {
        if (document.querySelector('flutter-view, flt-glass-pane')) {
          clearInterval(poll);
          hideSplash();
        }
      }, 500);
    })();
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
