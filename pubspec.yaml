name: chanting
description: Offline Buddhist prayer book app built with Flutter.
repository: https://github.com/saddhammadana/chanting
# This is an app repository, not a reusable pub.dev package.
publish_to: 'none'

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.0.0+1

environment:
  sdk: ^3.12.0

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter
  # Provides localized Material widgets such as time pickers. This does not
  # translate app UI; it declares the app locale support. See docs/internationalization.md Phase 0.
  flutter_localizations:
    sdk: flutter

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^2.0.0
  flutter_riverpod: ^3.3.2
  go_router: ^18.0.2
  shared_preferences: ^2.5.5
  google_fonts: ^8.2.1
  wakelock_plus: ^1.6.1
  package_info_plus: ^10.2.0
  flutter_local_notifications: ^22.3.1
  timezone: ^0.11.1
  flutter_timezone: ^5.1.1
  # Renders prayer-set sharing QR codes. Pure Dart; no native code or permission.
  # Owner-approved deviation from CLAUDE.md, July 2026.
  qr_flutter: ^4.1.0
  # Scans prayer-set QR codes. Native ML Kit/AVFoundation support on Android/iOS;
  # other platforms hide scan and use paste-code import. Owner-approved deviation
  # from CLAUDE.md, July 2026.
  mobile_scanner: ^7.3.0
  # Opens the user's mail app for prayer issue reports. If mailto cannot launch,
  # the report falls back to the clipboard. See prayer_report_sheet.dart.
  url_launcher: ^6.3.1
  # Plays the optional meditation completion bell. See docs/architecture/audio.md.
  just_audio: ^0.10.6
  # Brought in by just_audio, but used directly so the bell is configured as a
  # short notification sound rather than music. Without this, iOS can stop audio
  # from other apps. See CompletionSignalPlayer._configureSession.
  audio_session: ^0.2.4
  # Saves the playlist share QR card to Photos. Native; owner-approved
  # deviation from CLAUDE.md, September 2026.
  gal: ^2.3.3
  # Downloads the share QR card as a PNG on the web build, where gal has no
  # implementation. Dart team package, pure Dart.
  web: ^1.1.1
  # Picks a photo or image file on the scan page so its QR can be read with
  # mobile_scanner's analyzeImage. Needs iOS 14. Owner-approved deviation from
  # CLAUDE.md, September 2026.
  file_picker: ^13.1.0

  # Fetches a newer prayer book from dhammapanya.org, so a corrected line does
  # not need a new build. Dart team, pure Dart. This is the app's one network
  # request; see docs/architecture/content-updates.md. Owner-approved
  # deviation from CLAUDE.md, October 2026.
  http: ^1.6.0
  # Checks each fetched file against the hash the release names. Dart team,
  # pure Dart.
  crypto: ^3.0.7
  # Where the fetched prayer book is kept (application support, not prefs: it
  # is over a megabyte). Flutter team; already here through other plugins.
  path_provider: ^2.1.6

dev_dependencies:
  flutter_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # Lets Flutter run gen-l10n during build/run using l10n.yaml. This is SDK
  # codegen, not build_runner. See CLAUDE.md approved spec deviations.
  generate: true

  assets:
    # Declare the folder so new language editions such as prayers-<code>.json
    # can be added without changing pubspec.yaml.
    - assets/data/
    - assets/icon/app_icon.png
    # One folder per feature, as in lib/features/, plus shared/ for artwork
    # used by more than one. Folders, so a new file needs no edit here.
    - assets/images/home/
    - assets/images/meditation/
    - assets/images/playlists/
    - assets/images/settings/
    - assets/images/shared/
    # Bundled fonts. google_fonts reads these files instead of loading from the
    # network.
    - assets/google_fonts/
    # Meditation completion bell. Keep this as a single file, not the whole
    # folder, because assets/sound/README.md is provenance documentation and
    # should not be bundled into the app.
    - assets/sound/singing_bowl.mp3
    # Nature loops for the meditation timer. A folder of their own, so the
    # whole folder can be declared without bundling the README above it.
    - assets/sound/ambient/

flutter_launcher_icons:
  android: true
  ios: true
  web:
    generate: true
  windows:
    generate: true
  macos:
    generate: true
  image_path: assets/icon/app_icon.png
  # Android adaptive icons can crop about 28% at the edges depending on launcher
  # mask shape. app_icon_adaptive.png keeps the book and bodhi leaf inside the
  # safe zone and extends the background to the full square, so every mask keeps
  # the full mark visible. The image is opaque; background is only a fallback.
  adaptive_icon_background: "#FAF3E3"
  adaptive_icon_foreground: assets/icon/app_icon_adaptive.png
  remove_alpha_ios: true

  # To add assets to your application, add an assets section, like this:
  # assets:
  #   - images/a_dot_burr.jpeg
  #   - images/a_dot_ham.jpeg

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package
