# Analyzer configuration. `flutter analyze` must report no issues; CI runs it.
include: package:flutter_lints/flutter.yaml

analyzer:
  # Dart's strict modes, on because `lib/` already passed all three: an
  # implicit `dynamic` cast, an uninferable type and a raw generic are errors
  # rather than something to notice in review. Tests walk decoded JSON, so they
  # name the shapes they read instead of letting `dynamic` travel.
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  exclude:
    # Generated by gen-l10n; see docs/internationalization.md.
    - lib/l10n/app_localizations*.dart

linter:
  rules:
    # Additions to flutter_lints. Each one must pass on the whole tree, so a
    # rule that would need suppressions was left out rather than ignored.
    - always_declare_return_types
    - avoid_print
    - cancel_subscriptions
    - close_sinks
    - directives_ordering
    - prefer_const_constructors
    - prefer_const_declarations
    - prefer_const_literals_to_create_immutables
    - prefer_final_locals
    - prefer_relative_imports
    - prefer_single_quotes
    - require_trailing_commas
    - sort_child_properties_last
    - unawaited_futures
    - unnecessary_await_in_return
    - unnecessary_lambdas
    - use_super_parameters
