# Every report goes through a template, so a bug or a request arrives with the
# detail it needs; a blank issue is where one arrives without it.
blank_issues_enabled: false
contact_links:
  - name: Security or privacy issue
    url: https://github.com/saddhammadana/chanting/security/advisories/new
    about: Report it privately instead of opening a public issue. See SECURITY.md.
